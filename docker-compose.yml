services:
  timescaledb:
    image: timescale/timescaledb:2.18.0-pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - tsdb-data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  ingest:
    build: ./ingest
    env_file:
      - .env
    environment:
      POSTGRES_HOST: timescaledb
      POSTGRES_PORT: 5432
    volumes:
      - ./ingest:/app
      - ./data:/data
    depends_on:
      timescaledb:
        condition: service_healthy

  analysis:
    build: ./analysis
    env_file: .env
    environment:
      POSTGRES_HOST: timescaledb
      POSTGRES_PORT: 5432
    volumes:
      - ./analysis:/app
      - ./data:/data
    depends_on:
      timescaledb:
        condition: service_healthy

  web:
    build: ./web
    env_file: .env
    environment:
      POSTGRES_HOST: timescaledb
      POSTGRES_PORT: 5432
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - ./web:/app
      - ./analysis:/app/analysis
      - ./ingest:/app/ingest
      - ./data:/data
    depends_on:
      timescaledb:
        condition: service_healthy

volumes:
  tsdb-data:
